name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate raw data
        run: python -m src.validate
      - name: Run tests
        run: pytest -q --junitxml=pytest-report.xml
      # Job logs need a GitHub login; annotations are public, so failures show up there too.
      - name: Show failed tests as annotations
        if: failure()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest-report.xml").iter("testcase"):
              for bad in [*case.iter("failure"), *case.iter("error")]:
                  message = " ".join((bad.get("message") or "").split())[:600]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
          EOF

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test data layer against exported model output
        run: npm test
      - name: Build
        run: npm run build
